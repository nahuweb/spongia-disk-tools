[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spongia-disk-tools"
version = "0.1.1"
description = "CLI tools to analyze disk usage and safely remove files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "spongia" },
]
dependencies = []

[project.optional-dependencies]
trash = ["send2trash>=1.8"]
dev = ["build>=1.2", "ruff>=0.9"]

[project.scripts]
spongia = "spongia:main"

[tool.setuptools]
py-modules = [
    "spongia",
    "spongia_common",
    "spongia_remove",
    "spongia_scan",
    "spongia_translations",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]
